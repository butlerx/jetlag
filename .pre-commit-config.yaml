update:
  cooldown_days: 7
  freeze: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt

  # Runs after yamlfmt so it only reports what a formatter cannot fix.
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        pass_filenames: false
        args:
          - '--no-progress' # https://github.com/zizmorcore/zizmor/issues/582
          - '.github'

  - repo: local
    hooks:
      # tombi, rustfmt, yew-fmt and clippy come from the toolchain mise installs, not
      # a hook env, so the hooks and an editor running the same tool cannot disagree.
      - id: tombi-format
        name: tombi format
        language: system
        entry: tombi format
        types:
          - toml
      - id: tombi-lint
        name: tombi lint
        language: system
        entry: tombi lint
        types:
          - toml
      - id: rustfmt
        name: rustfmt
        language: system
        entry: cargo fmt --all --
        types:
          - rust
        pass_filenames: false
      # After rustfmt: yew-fmt also formats html! macro bodies.
      - id: yew-fmt
        name: yew-fmt
        language: system
        entry: yew-fmt
        types:
          - rust
      - id: clippy
        name: clippy
        language: system
        entry: cargo clippy --all-targets --all-features -- -D warnings
        types:
          - rust
        pass_filenames: false
