[package]
name        = "jetlag"
version     = "0.1.0"
edition     = "2021"
description = "An unofficial investigation book web app for tracking your notes and investigations while playing 'Jet Lag: The Game - Hide + Seek' home edition."
readme      = "README.md"
authors     = ["Cian Butler <butlerx@notthe.cloud>"]
repository  = "https://github.com/butlerx/jetlag"
license     = "MIT"
keywords    = [
  "hide-and-seek",
  "jetlag",
  "jetlagthegame",
  "rust",
  "wasm",
  "web",
  "yew",
]
categories  = ["game", "simple", "wasm", "web"]

[dependencies]
gloo-utils     = "0.2"
implicit-clone = { version = "0.4", features = ["map", "serde"] }
js-sys         = "0.3"
log            = "0.4.27"
thiserror      = "2"
wasm-bindgen   = "0.2"
wasm-logger    = "0.2.0"
web-sys        = {
  version  = "0.3",
  features = [
    "Blob",
    "HtmlAnchorElement",
    "Url",
    "Window",
  ]
}
yew            = { version = "0.21", features = ["csr"] }
yew-router     = "0.18"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml  = "0.8"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
