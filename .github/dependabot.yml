version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      yew-stack:
        patterns:
          - yew
          - yew-*
          - gloo-*
          - implicit-clone
          - js-sys
          - wasm-bindgen*
          - web-sys
      build-script:
        patterns:
          - serde
          - toml

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
    groups:
      github-pages:
        patterns:
          - actions/configure-pages
          - actions/upload-pages-artifact
          - actions/deploy-pages

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      prek-hooks:
        patterns:
          - '*'
